plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'com.gradleup.shadow' version '9.6.1'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file('runs/data'))
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    shade
    moulconfigClean {
        canBeResolved = true
        canBeConsumed = false
    }
}

def devMoulconfig = tasks.register('devMoulconfig', Sync) {
    from({ zipTree(configurations.moulconfigClean.singleFile) }) {
        include 'io/github/notenoughupdates/moulconfig/**'
        include 'assets/moulconfig/**'
        include 'META-INF/*.kotlin_module'
    }
    into layout.buildDirectory.dir('moulconfig/dev')
}
sourceSets.main.output.dir(builtBy: devMoulconfig, layout.buildDirectory.dir('moulconfig/dev'))

repositories {
    maven {
        name = "MoulConfig"
        url = "https://maven.notenoughupdates.org/releases/"
    }
}

dependencies {
    compileOnly(libs.moulconfig)
    compileOnly(libs.kotlin.stdlib)
    moulconfigClean(libs.moulconfig)
    shade(libs.kotlin.stdlib)
    runtimeOnly(libs.kotlin.stdlib)
}

tasks.named('jar', Jar) {
    archiveClassifier.set("unshaded")
}

tasks.shadowJar {
    archiveClassifier.set("")
    configurations = [project.configurations.shade]
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
}

tasks.build {
    dependsOn(tasks.shadowJar)
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}