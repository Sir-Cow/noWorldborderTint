plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '7.0.34'
    id 'com.gradleup.shadow' version '9.6.1'
}
base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    mappings channel: 'official', version: minecraft_version

    accessTransformer.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg'))

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('runs/' + name)

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                }
            }

            args "--mixin.config=${mod_id}.mixins.json", "--mixin.config=${mod_id}.forge.mixins.json"

            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }

        register('client') {}
        register('server') { args '--nogui' }
    }
}

sourceSets.main.resources { srcDir layout.projectDirectory.dir('src/generated/resources') }

configurations {
    shade
    moulconfigClean {
        canBeResolved = true
        canBeConsumed = false
    }
}

def devMoulconfig = tasks.register('devMoulconfig', Sync) {
    from({ zipTree(configurations.moulconfigClean.singleFile) }) {
        include 'io/github/notenoughupdates/moulconfig/**'
        include 'assets/moulconfig/**'
        include 'META-INF/*.kotlin_module'
    }
    into layout.buildDirectory.dir('moulconfig/dev')
}
sourceSets.main.resources.srcDir(files(layout.buildDirectory.dir('moulconfig/dev')).builtBy(devMoulconfig))

repositories {
    minecraft.mavenizer(it)
    maven fg.minecraftLibsMaven
    maven fg.forgeMaven
    mavenCentral()
    maven {
        name = "MoulConfig"
        url = "https://maven.notenoughupdates.org/releases/"
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    compileOnly project(':common')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.1'
    compileOnly(libs.moulconfig)
    compileOnly(libs.kotlin.stdlib)
    moulconfigClean(libs.moulconfig)
    shade(libs.kotlin.stdlib)
    runtimeOnly(libs.kotlin.stdlib)
}

tasks.named('jar', Jar) {
    archiveClassifier.set("unshaded")
    manifest {
        attributes([
                "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
        ])
    }
}

tasks.shadowJar {
    archiveClassifier.set("")
    configurations = [project.configurations.shade]
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
    manifest {
        attributes([
                "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
        ])
    }
}

tasks.build {
    dependsOn(tasks.shadowJar)
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'forge')
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}