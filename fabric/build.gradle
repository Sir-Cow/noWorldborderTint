plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom-remap'
    id 'com.gradleup.shadow' version '9.6.1'
}

configurations {
    shade
    moulconfigClean {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "MoulConfig"
        url = "https://maven.notenoughupdates.org/releases/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

def cleanMoulconfig = tasks.register('cleanMoulconfig', Zip) {
    from({ zipTree(configurations.moulconfigClean.singleFile) })
    exclude 'fabric.mod.json'
    exclude 'moulconfig.accesswidener'
    archiveFileName = 'moulconfig-clean.jar'
    destinationDirectory = layout.buildDirectory.dir('shade')
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "maven.modrinth:modmenu:${project.modmenu_version}"

    modImplementation(libs.moulconfig)
    modImplementation(libs.kotlin.stdlib)

    moulconfigClean(libs.moulconfig)
    shade(files(cleanMoulconfig.flatMap { it.archiveFile }))
    shade(libs.kotlin.stdlib)
}

tasks.jar {
    archiveClassifier.set("unshaded")
}

tasks.shadowJar {
    archiveClassifier.set("shadow")
    configurations = [project.configurations.shade]
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    relocate('io.github.notenoughupdates.moulconfig', 'sircow.noworldbordertint.shadow.moulconfig')
    relocate('kotlin', 'sircow.noworldbordertint.shadow.kotlin')
    mergeServiceFiles()
}

tasks.remapJar {
    dependsOn(tasks.shadowJar)
    inputFile.set(tasks.shadowJar.archiveFile)
    archiveClassifier.set("")
}

tasks.build {
    dependsOn(tasks.remapJar)
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.classtweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            displayName = 'Fabric Client'
            generateRunConfig = true
            runDirectory = file('runs/client')
            getProgramArguments().addAll(
                    "--tweakClass",
                    "io.github.notenoughupdates.moulconfig.tweaker.DevelopmentResourceTweaker"
            )
        }
        server {
            server()
            displayName = 'Fabric Server'
            generateRunConfig = true
            runDirectory = file('runs/server')
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}

sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}